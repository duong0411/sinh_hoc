name: Build & Release APK / IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (vd: v1.0.2) — dùng khi chạy tay"
        required: false
        default: "v1.0.2"

permissions:
  contents: write

env:
  APP_DIR: mobile

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin khớp máy local (tránh CI lấy bản Flutter lệch AGP)
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AI_SinhHoc.apk
          ls -lah dist/AI_SinhHoc.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_DIR }}/dist/AI_SinhHoc.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Pack IPA
        run: |
          set -e
          mkdir -p Payload dist
          APP_PATH=""
          for candidate in \
            build/ios/iphoneos/Runner.app \
            build/ios/Release-iphoneos/Runner.app
          do
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found"
            find build/ios -maxdepth 3 -type d -name "*.app" || true
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r dist/AI_SinhHoc.ipa Payload
          rm -rf Payload
          ls -lah dist/AI_SinhHoc.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.APP_DIR }}/dist/AI_SinhHoc.ipa
          if-no-files-found: error

  release:
    name: GitHub Release
    # Bắt buộc cả APK + IPA — tránh release chỉ có IPA như v1.0.1
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.version || 'v1.0.2' }}" >> "$GITHUB_OUTPUT"
          fi
          ls -lah artifacts
          test -f artifacts/AI_SinhHoc.apk
          test -f artifacts/AI_SinhHoc.ipa

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: AI Sinh Học ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/AI_SinhHoc.apk
            artifacts/AI_SinhHoc.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
